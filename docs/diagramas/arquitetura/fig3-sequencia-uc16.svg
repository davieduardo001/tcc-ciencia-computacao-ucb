<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="844" viewBox="0 0 1060 844" font-family="Liberation Sans, Arial, sans-serif">
<rect width="1060" height="844" fill="white"/>
<text x="530.0" y="28" text-anchor="middle" font-size="15" font-weight="bold">UC16 — Rastrear posição do ônibus em tempo real (US #16)</text>
<rect x="28" y="36" width="124" height="36" rx="4" fill="#D9E2F3" stroke="#6C8EBF"/>
<text x="90" y="56" text-anchor="middle" font-size="12">Passageiro</text>
<line x1="90" y1="78" x2="90" y2="824" stroke="#999" stroke-dasharray="5,4"/>
<rect x="193" y="36" width="124" height="52" rx="4" fill="#D9E2F3" stroke="#6C8EBF"/>
<text x="255" y="56" text-anchor="middle" font-size="12">Tela do mapa</text>
<text x="255" y="72" text-anchor="middle" font-size="12">(Next.js)</text>
<line x1="255" y1="94" x2="255" y2="824" stroke="#999" stroke-dasharray="5,4"/>
<rect x="358" y="36" width="124" height="36" rx="4" fill="#D9E2F3" stroke="#6C8EBF"/>
<text x="420" y="56" text-anchor="middle" font-size="12">API Gateway</text>
<line x1="420" y1="78" x2="420" y2="824" stroke="#999" stroke-dasharray="5,4"/>
<rect x="523" y="36" width="124" height="52" rx="4" fill="#D9E2F3" stroke="#6C8EBF"/>
<text x="585" y="56" text-anchor="middle" font-size="12">Serviço de</text>
<text x="585" y="72" text-anchor="middle" font-size="12">Mobilidade</text>
<line x1="585" y1="94" x2="585" y2="824" stroke="#999" stroke-dasharray="5,4"/>
<rect x="688" y="36" width="124" height="52" rx="4" fill="#D9E2F3" stroke="#6C8EBF"/>
<text x="750" y="56" text-anchor="middle" font-size="12">Serviço de</text>
<text x="750" y="72" text-anchor="middle" font-size="12">Autenticação</text>
<line x1="750" y1="94" x2="750" y2="824" stroke="#999" stroke-dasharray="5,4"/>
<rect x="853" y="36" width="124" height="36" rx="4" fill="#D9E2F3" stroke="#6C8EBF"/>
<text x="915" y="56" text-anchor="middle" font-size="12">Feed SEMOB</text>
<line x1="915" y1="78" x2="915" y2="824" stroke="#999" stroke-dasharray="5,4"/>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker></defs>
<line x1="90" y1="164" x2="251" y2="164" stroke="#333" marker-end="url(#a)"/>
<text x="172.5" y="158" text-anchor="middle" font-size="11">1: selecionarLinha(numero)</text>
<line x1="255" y1="198" x2="416" y2="198" stroke="#333" marker-end="url(#a)"/>
<text x="337.5" y="192" text-anchor="middle" font-size="11">2: GET /api/mobilidade/linhas/{n}/posicoes (cookie)</text>
<path d="M420,224 h38 v16 h-38" fill="none" stroke="#333" marker-end="url(#a)"/>
<text x="466" y="236" font-size="11">3: valida o JWT localmente</text>
<text x="20" y="260" font-size="11" font-weight="bold">alt</text>
<text x="60" y="260" font-size="11">[token válido]</text>
<line x1="420" y1="296" x2="581" y2="296" stroke="#333" marker-end="url(#a)"/>
<text x="502.5" y="290" text-anchor="middle" font-size="11">4: encaminha com a identidade do usuário</text>
<path d="M585,322 h38 v16 h-38" fill="none" stroke="#333" marker-end="url(#a)"/>
<text x="631" y="334" font-size="11">5: lê o feed em cache (20 s)</text>
<line x1="585" y1="364" x2="911" y2="364" stroke="#333" marker-end="url(#a)"/>
<text x="750.0" y="358" text-anchor="middle" font-size="11">6: GET posições (se o cache venceu)</text>
<line x1="915" y1="398" x2="589" y2="398" stroke="#333" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="750.0" y="392" text-anchor="middle" font-size="11">7: feed de posições</text>
<line x1="585" y1="432" x2="424" y2="432" stroke="#333" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="502.5" y="426" text-anchor="middle" font-size="11">8: posições da linha</text>
<line x1="420" y1="466" x2="259" y2="466" stroke="#333" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="337.5" y="460" text-anchor="middle" font-size="11">9: 200 + posições</text>
<path d="M255,492 h38 v16 h-38" fill="none" stroke="#333" marker-end="url(#a)"/>
<text x="301" y="504" font-size="11">10: desenha os ônibus; repete a cada 20 s</text>
<line x1="10" y1="516" x2="1005" y2="516" stroke="#6C8EBF" stroke-dasharray="4,3"/>
<text x="60" y="532" font-size="11">[token expirado ou ausente]</text>
<line x1="420" y1="564" x2="259" y2="564" stroke="#333" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="337.5" y="558" text-anchor="middle" font-size="11">4: 401 Não autenticado</text>
<line x1="255" y1="598" x2="416" y2="598" stroke="#333" marker-end="url(#a)"/>
<text x="337.5" y="592" text-anchor="middle" font-size="11">5: POST /api/auth/refresh (cookie de refresh)</text>
<line x1="420" y1="632" x2="746" y2="632" stroke="#333" marker-end="url(#a)"/>
<text x="585.0" y="626" text-anchor="middle" font-size="11">6: renova a sessão</text>
<line x1="750" y1="666" x2="424" y2="666" stroke="#333" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="585.0" y="660" text-anchor="middle" font-size="11">7: novos tokens</text>
<line x1="420" y1="700" x2="259" y2="700" stroke="#333" stroke-dasharray="6,4" marker-end="url(#a)"/>
<text x="337.5" y="694" text-anchor="middle" font-size="11">8: 200 + novos cookies</text>
<line x1="255" y1="734" x2="416" y2="734" stroke="#333" marker-end="url(#a)"/>
<text x="337.5" y="728" text-anchor="middle" font-size="11">9: refaz a chamada do passo 2</text>
<rect x="10" y="246" width="995" height="508" fill="none" stroke="#6C8EBF"/>
</svg>