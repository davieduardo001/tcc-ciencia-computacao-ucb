<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movecity — Link Enviado</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- US #13 — confirmação -->
  <div class="page-auth">
    <div class="phone">
      <div class="phone-head">
        <a href="recuperar-senha.html" class="back ico" data-i="arrow-left"></a>
        <h2>Recuperar senha</h2>
      </div>
      <div class="phone-body center">
        <div class="icon-tile" style="width:84px;height:84px;border-radius:24px;background:var(--green-bg);color:var(--green);margin:8px auto 22px"><span class="ico" data-i="mailcheck" style="width:38px;height:38px"></span></div>
        <h3 style="font-size:20px">Link enviado com sucesso!</h3>
        <p class="muted" style="margin-top:8px">Se o e-mail estiver cadastrado em nossa base, um link de recuperação foi enviado para a sua caixa de entrada.</p>

        <div class="note note-warn" style="text-align:left;margin:20px 0">
          <span class="ico" data-i="info"></span>
          <span>Não recebeu? Verifique sua pasta de spam ou tente novamente em alguns minutos.</span>
        </div>

        <a class="btn btn-primary btn-block btn-lg" href="redefinir-senha.html" style="margin-bottom:12px">Abrir link (demo)</a>
        <a class="btn btn-ghost btn-block" href="login.html">Voltar ao login</a>
        <a class="btn btn-ghost btn-block" href="recuperar-senha.html" style="margin-top:12px"><span class="ico ico-sm" data-i="refresh"></span> Reenviar e-mail</a>
      </div>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
