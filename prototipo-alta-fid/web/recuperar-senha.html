<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movecity — Recuperar Senha</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- US #13 -->
  <div class="auth">
    <aside class="auth-aside photo">
      <div class="auth-logo"><span class="mark"><span class="ico" data-i="bus"></span></span> Movecity</div>
      <div>
        <h1>Mobilidade<br>sem surpresas.</h1>
        <p>Recupere o acesso e volte a acompanhar suas linhas em tempo real.</p>
      </div>
      <div class="auth-dots"><span class="on"></span><span></span><span></span></div>
      <div class="glow"></div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <div class="icon-tile" style="background:var(--surface-2);color:var(--primary);margin-bottom:16px"><span class="ico" data-i="lock"></span></div>
        <h2>Recuperar senha</h2>
        <p class="muted" style="margin-top:6px;margin-bottom:24px">Insira o e-mail associado à sua conta. Enviaremos um link para você redefinir sua senha.</p>
        <form data-demo="link-enviado.html">
          <div class="field">
            <label>E-mail</label>
            <div class="input-wrap"><span class="lead ico ico-sm" data-i="mail"></span>
              <input class="input has-lead" type="email" placeholder="seu@email.com"></div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit"><span class="ico ico-sm" data-i="send"></span> Enviar link de recuperação</button>
          <p class="center" style="margin-top:20px"><a href="login.html" class="bold flex items-center gap-8" style="justify-content:center"><span class="ico ico-sm" data-i="arrow-left"></span> Voltar para o login</a></p>
        </form>
      </div>
    </main>
  </div>
  <script src="assets/js/app.js"></script>
</body>
</html>
