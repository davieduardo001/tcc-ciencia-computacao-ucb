      - run: >
          flyctl deploy
          --config src/backend/gateway/fly.toml
          --dockerfile src/backend/gateway/Dockerfile
          --remote-only
          .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_GATEWAY }}
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://movecity-gateway.fly.dev/health)
