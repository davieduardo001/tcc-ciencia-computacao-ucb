name: Deploy Backend (Fly.io)

on:
  push:
    branches: [homolog, main]
    paths:
      - "src/backend/**"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:

jobs:
  deploy-auth:
    name: Deploy auth
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fly-auth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >
          flyctl deploy
          --config src/backend/auth/fly.toml
          --dockerfile src/backend/auth/Dockerfile
          --remote-only
          .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_AUTH }}
      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://movecity-auth.fly.dev/health)
            if [ "$code" = "200" ]; then
              echo "Servico auth respondendo (HTTP $code)"
              exit 0
            fi
            echo "Tentativa $i: HTTP $code, aguardando..."
            sleep 5
          done
          echo "Servico auth nao respondeu 200 em /health apos o deploy"
          exit 1

  deploy-mobilidade:
    name: Deploy mobilidade
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fly-mobilidade
