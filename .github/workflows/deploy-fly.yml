name: Deploy Backend (Fly.io)

on:
  push:
    branches: [homolog, main]
    paths:
      - "src/backend/**"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch:

jobs:
  deploy-auth:
    name: Deploy auth
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fly-auth
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >
          flyctl deploy
          --config src/backend/auth/fly.toml
          --dockerfile src/backend/auth/Dockerfile
          --remote-only
          .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_AUTH }}

  deploy-mobilidade:
    name: Deploy mobilidade
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fly-mobilidade
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >
          flyctl deploy
          --config src/backend/mobilidade/fly.toml
          --dockerfile src/backend/mobilidade/Dockerfile
          --remote-only
          .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_MOBILIDADE }}

  deploy-colaboracao:
    name: Deploy colaboracao
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-fly-colaboracao
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >
          flyctl deploy
          --config src/backend/colaboracao/fly.toml
          --dockerfile src/backend/colaboracao/Dockerfile
          --remote-only
          .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_COLABORACAO }}

  deploy-gateway:
    name: Deploy gateway
    runs-on: ubuntu-latest
    needs: [deploy-auth, deploy-mobilidade, deploy-colaboracao]
    concurrency:
      group: deploy-fly-gateway
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >
          flyctl deploy
          --config src/backend/gateway/fly.toml
          --dockerfile src/backend/gateway/Dockerfile
          --remote-only
          .
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN_GATEWAY }}
