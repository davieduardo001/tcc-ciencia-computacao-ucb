name: CI — Testes no PR

on:
  pull_request:
    branches: [homolog, main]

  workflow_dispatch:

jobs:
  test-backend:
    name: Testes Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: movecity
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: movecity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://movecity:test_password@localhost:5432/movecity_test
      JWT_SECRET: test-secret-for-ci-only
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          cd src/backend
          pip install -r requirements.txt

      - name: Health check
        run: |
          cd src/backend
          uvicorn gateway.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
          curl -sf http://localhost:8000/health || exit 1
          kill %1 || true

      - name: Rodar migrations
        run: |
          cd src/backend
          alembic upgrade head

      - name: Rodar testes
        run: |
          cd src/backend
          pytest -v --tb=short

  verificar-servicos:
    # Reproduz o que o contêiner de cada serviço faz no boot.
    #
    # O job de testes instala o requirements COMBINADO da raiz, que tem
    # tudo. O Dockerfile de cada serviço instala só o requirements dele.
    # Por isso dependência faltando no arquivo de um serviço passava verde
    # aqui e derrubava o contêiner em produção — aconteceu no PR #102
    # (mobilidade) e no #127/#128 (colaboracao).
    #
    # A verificação anterior (`pip install -r ... --dry-run`) não pegava
    # isso: o dry-run confere se os pacotes LISTADOS no arquivo resolvem,
    # e não tem como saber de um pacote que o código importa e que está
    # ausente da lista. Era justamente esse o defeito das duas quedas.
    #
    # Aqui cada serviço ganha um venv limpo com só o próprio requirements,
    # e a aplicação é importada. Falta de dependência quebra o import, que
    # é exatamente o que acontece no boot do contêiner.
    name: Contêiner do serviço (${{ matrix.servico }})
    runs-on: ubuntu-latest

    strategy:
      # Sem fail-fast: se dois serviços estiverem quebrados, queremos ver
      # os dois, não só o primeiro.
      fail-fast: false
      matrix:
        servico: [gateway, auth, mobilidade, colaboracao]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/${{ matrix.servico }}/requirements.txt

      - name: Instalar SÓ o requirements deste serviço
        run: |
          python -m venv /tmp/venv-${{ matrix.servico }}
          /tmp/venv-${{ matrix.servico }}/bin/pip install --quiet --upgrade pip
          /tmp/venv-${{ matrix.servico }}/bin/pip install --quiet \
            -r src/backend/${{ matrix.servico }}/requirements.txt

      - name: Importar a aplicação, como o contêiner faz no boot
        run: |
          cd src/backend
          /tmp/venv-${{ matrix.servico }}/bin/python -c \
            "from ${{ matrix.servico }}.main import app; print('${{ matrix.servico }}: import OK')"

  test-frontend:
    name: Testes Frontend (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependências
        run: |
          cd src/frontend
          npm ci

      - name: Rodar testes
        run: |
          cd src/frontend
          npm test

  lint:
    name: Lint e Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar Conventional Commits
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          BASE="${{ github.event.pull_request.base.ref }}"
          HEAD="${{ github.event.pull_request.head.ref }}"

          if [ -z "$PR_NUMBER" ]; then
            echo "Não é PR. Pulando verificação."
            exit 0
          fi

          PADRAO='^(feat|fix|docs|style|refactor|chore|test|perf|ci|build|revert)(\(.+\))?: .{1,72}'
          INVALID=0

          # 1) Título do PR.
          #
          # Como o projeto faz squash merge, é o TÍTULO que vira a
          # mensagem do commit na branch de destino — não os commits da
          # branch. Validar só os commits deixava passar título fora do
          # padrão: foi assim que "feat/issue Receber Notificações de
          # Rotas Preferidas #22" entrou no homolog pelo PR #94 e passou
          # a reprovar todo PR de promoção daí em diante.
          echo "=== Título do PR (vira a mensagem do commit no squash) ==="
          TITULO=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER --jq '.title')
          echo "$TITULO"
          if ! echo "$TITULO" | grep -qE "$PADRAO"; then
            echo "❌ Título fora do padrão: $TITULO"
            INVALID=1
          fi
          echo ""

          # 2) Commits da branch.
          #
          # Pulado no PR de promoção homolog -> main: ali o conteúdo já
          # passou por este mesmo check ao entrar em homolog, e revalidar
          # significa reprovar o PR de hoje por causa de histórico antigo
          # que ninguém pode mais corrigir sem reescrever branch
          # compartilhada.
          if [ "$BASE" = "main" ] && [ "$HEAD" = "homolog" ]; then
            echo "=== PR de promoção homolog -> main ==="
            echo "Commits já validados quando entraram em homolog. Pulando."
          else
            echo "=== Verificando mensagens de commit ==="
            SUBJECTS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/commits --jq '.[].commit.message | split("\n")[0]')
            echo "$SUBJECTS"
            echo ""

            while IFS= read -r subject; do
              [ -z "$subject" ] && continue
              [[ "$subject" == Merge\ * ]] && continue

              if ! echo "$subject" | grep -qE "$PADRAO"; then
                echo "❌ Commit inválido: $subject"
                INVALID=1
              fi
            done <<< "$SUBJECTS"
          fi

          if [ $INVALID -eq 1 ]; then
            echo ""
            echo "=== Fora do padrão Conventional Commits ==="
            echo "Formato esperado: <tipo>: <descrição>"
            echo "Tipos: feat, fix, docs, style, refactor, chore, test, perf, ci, build, revert"
            exit 1
          fi

          echo "✅ Título e commits seguem Conventional Commits"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
