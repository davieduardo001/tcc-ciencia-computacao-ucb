name: CI — Testes no PR

on:
  pull_request:
    branches: [homolog, main]
    paths:
      - "src/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

jobs:
  test-backend:
    name: Testes Backend (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: movecity
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: movecity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://movecity:test_password@localhost:5432/movecity_test
      JWT_SECRET: test-secret-for-ci-only
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 60
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          cd src/backend
          pip install -r requirements.txt

      - name: Rodar migrations
        run: |
          cd src/backend
          alembic upgrade head

      - name: Rodar testes
        run: |
          cd src/backend
          pytest -v --tb=short

  test-frontend:
    name: Testes Frontend (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependências
        run: |
          cd src/frontend
          npm ci

      - name: Rodar testes
        run: |
          cd src/frontend
          npm test

  lint:
    name: Lint e Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar Conventional Commits
        run: |
          echo "=== Verificando mensagens de commit ==="
          PR_NUMBER=${{ github.event.pull_request.number }}
          
          if [ -z "$PR_NUMBER" ]; then
            echo "Não é PR. Pulando verificação."
            exit 0
          fi
          
          # Pegar commits do PR
          COMMITS=$(gh api repos/${{ github.repository }}/pulls/$PR_NUMBER/commits --jq '.[].commit.message')
          
          echo "Commits encontrados:"
          echo "$COMMITS"
          echo ""
          
          # Validar cada commit
          INVALID=0
          while IFS= read -r commit; do
            # Pular linhas vazias
            [ -z "$commit" ] && continue
            
            # Verificar se segue Conventional Commits
            if ! echo "$commit" | grep -qE '^(feat|fix|docs|style|refactor|chore|test|perf|ci|build|revert)(\(.+\))?: .{1,72}'; then
              echo "❌ Commit inválido: $commit"
              INVALID=1
            fi
          done <<< "$COMMITS"
          
          if [ $INVALID -eq 1 ]; then
            echo ""
            echo "=== Alguns commits não seguem Conventional Commits ==="
            echo "Formato esperado: <tipo>: <descrição>"
            echo "Tipos: feat, fix, docs, style, refactor, chore, test, perf, ci, build, revert"
            exit 1
          fi
          
          echo "✅ Todos os commits seguem Conventional Commits"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
